<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="org.deepin.dde.Daemon1"/>

    <allow send_destination="org.deepin.dde.Daemon1"
           send_interface="org.deepin.dde.Daemon1"
           send_member="SetAllowCaller"/>

    <allow send_interface="org.deepin.dde.ServiceTrigger1.Agent"/>
  </policy>

  <!-- Only root and deepin-daemon group can call SetAllowCaller -->
  <policy group="deepin-daemon">
    <allow send_destination="org.deepin.dde.Daemon1"
           send_interface="org.deepin.dde.Daemon1"
           send_member="SetAllowCaller"/>
  </policy>

  <!-- Allow anyone to invoke methods on the interfaces -->
  <policy context="default">
    <allow send_destination="org.deepin.dde.Daemon1"/>

    <allow send_destination="org.deepin.dde.Daemon1"
           send_interface="org.deepin.dde.Daemon1"/>
    <allow send_destination="org.deepin.dde.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.deepin.dde.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>

    <deny send_destination="org.deepin.dde.Daemon1"
          send_interface="org.deepin.dde.Daemon1"
          send_member="SetAllowCaller"/>
  </policy>

</busconfig>
